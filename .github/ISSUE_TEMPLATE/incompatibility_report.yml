name: Incompatibility Report
description: Report an incompatibility with Ping Wheel
title: "[Incompatibility]: "
labels: "incompatibility :boom:"
body:
- type: checkboxes
  attributes:
    label: Preflight Checklist
    description: Please ensure you've completed all of the following.
    options:
      - label: After testing with only Ping Wheel installed, the issue no longer remains. Otherwise, [report a bug](https://github.com/LukenSkyne/Minecraft-Ping-Wheel/issues/new?template=bug_report.yml) instead.
        required: true
      - label: I am using the [latest version](https://github.com/LukenSkyne/Minecraft-Ping-Wheel/releases) of Ping Wheel for the corresponding mod loader.
        required: true
      - label: The server I am playing on has Ping Wheel installed.
        required: true
      - label: I have searched the [issue tracker](https://github.com/LukenSkyne/Minecraft-Ping-Wheel/issues?q=is%3Aissue) for an incompatibility report that matches the one I want to file, without success.
        required: true

- type: dropdown
  attributes:
    label: Which mod loaders have you experienced the issue with?
    multiple: true
    options:
      - Fabric
      - NeoForge
      - Forge
  validations:
    required: true

- type: dropdown
  attributes:
    label: What versions of Minecraft have you experienced the issue in?
    multiple: true
    options:
      - 1.21.11
      - 1.21.9–1.21.10
      - 1.21.6–1.21.8
      - 1.21.5
      - 1.21.4
      - 1.21.2–1.21.3
      - 1.21–1.21.1
      - 1.20.5–1.20.6
      - 1.20.3–1.20.4
      - 1.20.2
      - 1.20–1.20.1
      - 1.19.4
      - 1.19.3
      - 1.19–1.19.2
      - 1.18–1.18.2
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected Behavior
    description: A clear and concise description of what you expected to happen.
  validations:
    required: true

- type: textarea
  attributes:
    label: Actual Behavior
    description: A clear description of what actually happens.
  validations:
    required: true

- type: input
  attributes:
    label: Logs URL
    description: Please upload your latest log file to [mclo.gs](https://mclo.gs/) and put the URL here. You can find the log file in your instance folder at `.minecraft/logs/latest.log`.
    placeholder: https://mclo.gs/...
  validations:
    required: true

- type: textarea
  attributes:
    label: Mod or Modpack details
    description: |
      Specify the mod(pack) name and provide one of the following:
      - A link to the CurseForge or Modrinth page
      - A CurseForge pack file as a `.zip` (see [here](https://support.curseforge.com/en/support/solutions/articles/9000198501-exporting-and-importing-modpacks))
      - A Modrinth `.mrpack` file contained in a `.zip` file (see [here](https://support.modrinth.com/en/articles/8802250-modpacks-on-modrinth))

      If your modpack contains unpublished mods, please remove them first, as we cannot help with debugging otherwise.
  validations:
    required: true

- type: textarea
  attributes:
    label: Additional Information
    description: If your problem needs further explanation, or if you can give instructions to reproduce the issue, please add more information here.
